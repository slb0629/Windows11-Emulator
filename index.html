<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11</title>
    <link rel="stylesheet" href="styles/desktop.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/edge.css">
</head>
<body>
    <div class="whole">

        <!-- desktop icons -->
        <div class="apps app-bin">
            <div class="bin icon"></div>
            <div class="name">Recycle Bin</div>
        </div>
        <div class="apps app-file">
            <div class="file icon"></div>
            <div class="name">Windows Explorer</div>
        </div>
        <div class="apps app-edge">
            <div class="edge icon"></div>
            <div class="name">Microsoft Edge</div>
        </div>

        <!-- start menu -->
        <div class="pop">
            <div class="pop-search"></div>
            <div class="app-widget"></div>
            <div class="log-info"></div>
        </div>

        <!-- edge window -->
        <div id="edge">

            <!-- row 1: title bar -->
            <div id="top-part">
                <div id="tabs"></div>
                <div id="right-part">
                    <div id="down" class="a4">
                        <svg width="10" height="10" viewBox="0 0 10 10">
                            <line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1"/>
                        </svg>
                    </div>
                    <div id="maximize" class="a4">
                        <svg width="10" height="10" viewBox="0 0 10 10">
                            <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/>
                        </svg>
                    </div>
                    <div id="close" class="a5">
                        <svg width="10" height="10" viewBox="0 0 10 10">
                            <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1"/>
                            <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- row 2: toolbar -->
            <div id="search-part">
                <div class="a1 back" title="Back">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 8H2M7 3L2 8l5 5"/>
                    </svg>
                </div>
                <div class="a1 forward" title="Forward">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 8h12M9 3l5 5-5 5"/>
                    </svg>
                </div>
                <div class="a1 refresh" title="Refresh">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/>
                        <path d="M13.5 2.5v3h-3"/>
                    </svg>
                </div>

                <input type="text" id="browser-search" placeholder="Search or enter website URL">

                <div class="a1 three-dots" title="Settings and more">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <circle cx="3" cy="8" r="1.4"/>
                        <circle cx="8" cy="8" r="1.4"/>
                        <circle cx="13" cy="8" r="1.4"/>
                    </svg>
                </div>
            </div>

            <!-- row 3: page -->
            <div id="edge-body">
                <iframe src="https://www.google.com/search?igu=1"></iframe>
            </div>

        </div> <!-- end #edge -->

        <!-- taskbar -->
        <div class="footer">
            <div class="hover win">
                <div class="windows"></div>
            </div>
            <div class="footer-search">
                <div class="search-logo"></div>
            </div>
            <div id="small-icon"></div>
            <div id="date">
                <p id="time"></p>
                <p id="actual-date"></p>
            </div>
        </div>

    </div>

    <script src="javascript/desktop.js"></script>
    <script src="javascript/edge.js"></script>
</body>
</html>
